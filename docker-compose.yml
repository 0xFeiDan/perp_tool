services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      RUNTIME_DIR: /app/backend/runtime
      # Never allow the container to enable real execution without the
      # PostgreSQL pre-submit/idempotency ledger being reachable.
      DURABLE_EXECUTION_REQUIRED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-strategy}
      POSTGRES_USER: ${POSTGRES_USER:-strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose.env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/compose.env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Runtime/audit data must be owned by the service account on Ubuntu.
      - strategy-runtime:/app/backend/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private

  runtime-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /app/backend/runtime"]
    volumes:
      - strategy-runtime:/app/backend/runtime
    networks:
      - private

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-strategy}
      POSTGRES_USER: ${POSTGRES_USER:-strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose.env}
    command: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strategy}
      POSTGRES_USER: ${POSTGRES_USER:-strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in the deployment environment}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Deliberately loopback-only. Tailscale Serve terminates HTTPS and
      # forwards to this local HTTP listener; Docker never publishes 80/443.
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  strategy-runtime:
  caddy-data:
  caddy-config:
